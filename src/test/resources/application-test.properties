spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false

jwt.secret=test-secret-at-least-256-bits-long-for-testing-purposes
jwt.expiration=3600000

kakao.login.client-id=test-client-id
kakao.login.client-secret=test-client-secret
kakao.login.redirect-uri=http://localhost:8080/api/auth/kakao/callback
